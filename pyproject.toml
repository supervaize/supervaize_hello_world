[project]
name = "supervaize-hello-world"
version = "1.2"
description = "Hello World basic case - for integration of Supervaize agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.1", "loguru>=0.7.3", "supervaizer==1.8.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
